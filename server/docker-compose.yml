version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: offlinepay_postgres
    environment:
      POSTGRES_USER: offlinepay
      POSTGRES_PASSWORD: offlinepay_password
      POSTGRES_DB: offlinepay_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offlinepay"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
